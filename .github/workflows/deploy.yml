name: Tests and production deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: crm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://crm_test:isolated_test_password@localhost:5432/crm_test
      JWT_SECRET: ci-test-secret-never-used-in-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm ci --prefix client --no-audit --no-fund
      - run: npm test --prefix server
      - run: npm test --prefix client
      - run: npm run build --prefix client -- --base=/
        env:
          VITE_API_URL: /api
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: konzocrm-production
      cancel-in-progress: false
    steps:
      # No repository code or dependencies execute in this job with SSH secrets.
      - name: Deploy verified commit
        env:
          DEPLOY_KEY: ${{ secrets.KONZOCRM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KONZOCRM_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/konzocrm"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          ssh -i "$HOME/.ssh/konzocrm" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            konzocrm-deploy@76.13.115.72 "deploy $COMMIT_SHA"
