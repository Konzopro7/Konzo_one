server {
    listen 80;
    listen [::]:80;
    server_name konzocrm.com www.konzocrm.com;
    location /.well-known/acme-challenge/ { root /var/lib/konzocrm/acme; }
    location / { return 301 https://konzocrm.com$request_uri; }
}
# Initial HTTP configuration. Enable TLS with Certbot only after DNS resolves.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name konzocrm.com www.konzocrm.com;
    ssl_certificate /etc/letsencrypt/live/konzocrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konzocrm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/konzocrm/current/client/dist;
    index index.html;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Access logs exclude query strings, which may contain portal credentials.
    access_log off;

    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
