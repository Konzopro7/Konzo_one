# No CRM login over unencrypted HTTP during DNS/certificate setup.
server {
    listen 80;
    listen [::]:80;
    server_name konzocrm.com www.konzocrm.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/konzocrm-acme; }
    location / { return 503 "konzoCRM : activation HTTPS en cours.\n"; }
}